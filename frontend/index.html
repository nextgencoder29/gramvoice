<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GramVoice — सरकारी योजना सहायक</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Hindi:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --saffron:   #FF7F11;
    --green:     #138808;
    --navy:      #000080;
    --cream:     #FFF8F0;
    --charcoal:  #1C1C2E;
    --muted:     #6B6B80;
    --card-bg:   #FFFFFF;
    --border:    rgba(0,0,128,0.1);
    --shadow:    0 8px 40px rgba(0,0,128,0.10);
  }

  html, body {
    min-height: 100vh;
    background: var(--cream);
    font-family: 'DM Sans', sans-serif;
    color: var(--charcoal);
  }

  /* ── BACKGROUND TEXTURE ── */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background:
      radial-gradient(ellipse 80% 50% at 20% -10%, rgba(255,127,17,0.12) 0%, transparent 60%),
      radial-gradient(ellipse 60% 40% at 90% 110%, rgba(19,136,8,0.10) 0%, transparent 55%),
      url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23000080' fill-opacity='0.025'%3E%3Ccircle cx='30' cy='30' r='2'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
  }

  /* ── LAYOUT ── */
  .app {
    position: relative; z-index: 1;
    min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center;
  }

  /* ── HEADER ── */
  header {
    width: 100%;
    padding: 20px 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
    background: rgba(255,248,240,0.8);
    backdrop-filter: blur(12px);
    position: sticky; top: 0; z-index: 10;
  }

  .logo {
    display: flex; align-items: center; gap: 12px;
  }

  .logo-mark {
    width: 40px; height: 40px;
    background: linear-gradient(135deg, var(--saffron), var(--navy));
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
  }

  .logo h1 {
    font-family: 'Tiro Devanagari Hindi', serif;
    font-size: 1.5rem;
    color: var(--navy);
    letter-spacing: -0.02em;
  }

  .logo span {
    font-size: 0.75rem;
    color: var(--muted);
    font-weight: 300;
    display: block;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  .lang-selector {
    display: flex; gap: 8px;
  }

  .lang-btn {
    padding: 6px 14px;
    border-radius: 20px;
    border: 1.5px solid var(--border);
    background: transparent;
    font-size: 0.8rem;
    font-family: 'DM Sans', sans-serif;
    cursor: pointer;
    color: var(--muted);
    transition: all 0.2s;
  }
  .lang-btn.active, .lang-btn:hover {
    background: var(--navy);
    color: #fff;
    border-color: var(--navy);
  }

  /* ── MAIN ── */
  main {
    flex: 1;
    width: 100%;
    max-width: 720px;
    padding: 60px 24px 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 40px;
  }

  /* ── HERO TEXT ── */
  .hero {
    text-align: center;
  }

  .hero h2 {
    font-family: 'Tiro Devanagari Hindi', serif;
    font-size: clamp(1.8rem, 5vw, 2.8rem);
    color: var(--navy);
    line-height: 1.2;
    margin-bottom: 12px;
  }

  .hero p {
    font-size: 1rem;
    color: var(--muted);
    font-weight: 300;
  }

  /* ── MIC BUTTON ── */
  .mic-zone {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
  }

  .mic-wrap {
    position: relative;
  }

  .ripple {
    position: absolute;
    inset: -20px;
    border-radius: 50%;
    border: 2px solid var(--saffron);
    opacity: 0;
    animation: none;
    pointer-events: none;
  }

  .mic-btn {
    position: relative; z-index: 1;
    width: 110px; height: 110px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    background: linear-gradient(145deg, var(--saffron) 0%, #e05f00 100%);
    box-shadow: 0 10px 40px rgba(255,127,17,0.40), 0 2px 8px rgba(255,127,17,0.2);
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.15s, box-shadow 0.15s;
    outline: none;
  }

  .mic-btn:hover { transform: scale(1.04); }
  .mic-btn:active { transform: scale(0.97); }

  .mic-btn.recording {
    background: linear-gradient(145deg, #e03030, #b00000);
    box-shadow: 0 10px 40px rgba(220,50,50,0.45), 0 2px 8px rgba(220,50,50,0.3);
    animation: pulse 1.2s ease-in-out infinite;
  }

  .mic-btn.loading {
    background: linear-gradient(145deg, var(--navy), #0000aa);
    box-shadow: 0 10px 40px rgba(0,0,128,0.35);
    cursor: not-allowed;
  }

  .mic-btn svg { width: 44px; height: 44px; fill: white; }

  .mic-btn.recording .ripple {
    animation: ripple-out 1.2s ease-out infinite;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.06); }
  }
  @keyframes ripple-out {
    0%   { transform: scale(0.8); opacity: 0.7; }
    100% { transform: scale(1.5); opacity: 0; }
  }

  .mic-label {
    font-size: 0.9rem;
    color: var(--muted);
    font-weight: 500;
    letter-spacing: 0.03em;
    text-align: center;
    min-height: 1.4em;
  }

  /* ── OFFLINE BADGE ── */
  .status-bar {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 0.78rem;
    font-weight: 500;
  }
  .status-bar.online  { background: rgba(19,136,8,0.1);  color: var(--green); }
  .status-bar.offline { background: rgba(255,127,17,0.1); color: var(--saffron); }
  .dot {
    width: 7px; height: 7px; border-radius: 50%;
  }
  .online .dot  { background: var(--green); }
  .offline .dot { background: var(--saffron); }

  /* ── RESULT CARD ── */
  .result-card {
    width: 100%;
    background: var(--card-bg);
    border-radius: 20px;
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    padding: 28px;
    display: none;
    flex-direction: column;
    gap: 20px;
    animation: slide-up 0.4s cubic-bezier(0.22,1,0.36,1);
  }

  .result-card.visible { display: flex; }

  @keyframes slide-up {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .result-section label {
    font-size: 0.7rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
    display: block;
    margin-bottom: 8px;
  }

  .transcript-text {
    font-family: 'Tiro Devanagari Hindi', serif;
    font-size: 1.05rem;
    color: var(--charcoal);
    line-height: 1.6;
  }

  .answer-text {
    font-size: 1.15rem;
    color: var(--navy);
    font-weight: 500;
    line-height: 1.65;
  }

  .divider {
    width: 100%;
    height: 1px;
    background: var(--border);
  }

  .play-btn {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 20px;
    border-radius: 12px;
    border: 1.5px solid var(--green);
    background: rgba(19,136,8,0.06);
    color: var(--green);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.85rem;
    font-weight: 500;
    cursor: pointer;
    align-self: flex-start;
    transition: all 0.2s;
  }
  .play-btn:hover {
    background: rgba(19,136,8,0.12);
  }
  .play-btn svg { width: 16px; height: 16px; fill: var(--green); }

  /* ── OFFLINE QUEUE ── */
  .queue-card {
    width: 100%;
    background: rgba(255,127,17,0.06);
    border: 1.5px dashed rgba(255,127,17,0.4);
    border-radius: 16px;
    padding: 20px 24px;
    display: none;
  }
  .queue-card.visible { display: block; }
  .queue-card h3 {
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--saffron);
    margin-bottom: 10px;
  }
  .queue-item {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 0;
    border-bottom: 1px solid rgba(255,127,17,0.15);
    font-size: 0.82rem;
    color: var(--charcoal);
  }
  .queue-item:last-child { border: none; }
  .queue-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--saffron); }

  /* ── SUGGESTIONS ── */
  .suggestions {
    width: 100%;
  }
  .suggestions h3 {
    font-size: 0.75rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin-bottom: 12px;
  }
  .pills {
    display: flex; flex-wrap: wrap; gap: 8px;
  }
  .pill {
    padding: 8px 16px;
    border-radius: 20px;
    border: 1.5px solid var(--border);
    background: white;
    font-size: 0.82rem;
    cursor: pointer;
    color: var(--charcoal);
    transition: all 0.2s;
    font-family: 'DM Sans', sans-serif;
  }
  .pill:hover {
    border-color: var(--saffron);
    color: var(--saffron);
    background: rgba(255,127,17,0.04);
  }

  /* ── FOOTER ── */
  footer {
    padding: 20px;
    text-align: center;
    font-size: 0.75rem;
    color: var(--muted);
  }

  /* ── SPINNER ── */
  .spinner {
    width: 36px; height: 36px;
    border: 3px solid rgba(255,255,255,0.3);
    border-top-color: white;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="app">

  <!-- HEADER -->
  <header>
    <div class="logo">
      <div class="logo-mark">🎙️</div>
      <div>
        <h1>GramVoice</h1>
        <span>Government Scheme Assistant</span>
      </div>
    </div>
    <div class="lang-selector">
      <button class="lang-btn active" data-lang="hi-IN">हिन्दी</button>
      <button class="lang-btn" data-lang="ta-IN">தமிழ்</button>
      <button class="lang-btn" data-lang="te-IN">తెలుగు</button>
      <button class="lang-btn" data-lang="en-IN">EN</button>
    </div>
  </header>

  <!-- MAIN -->
  <main>

    <!-- HERO -->
    <div class="hero">
      <h2>सरकारी योजना के बारे में<br/>पूछिए, बोलकर</h2>
      <p>Ask about any government scheme in your language</p>
    </div>

    <!-- STATUS -->
    <div class="status-bar online" id="statusBar">
      <div class="dot"></div>
      <span id="statusText">Connected</span>
    </div>

    <!-- MIC -->
    <div class="mic-zone">
      <div class="mic-wrap">
        <div class="ripple" id="ripple"></div>
        <button class="mic-btn" id="micBtn" onclick="toggleRecord()">
          <svg id="micIcon" viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.91-3c-.49 0-.9.36-.98.85C16.52 14.2 14.47 16 12 16s-4.52-1.8-4.93-4.15c-.08-.49-.49-.85-.98-.85-.61 0-1.09.54-1 1.14.49 3 2.89 5.35 5.91 5.78V20c0 .55.45 1 1 1s1-.45 1-1v-2.08c3.02-.43 5.42-2.78 5.91-5.78.1-.6-.39-1.14-1-1.14z"/></svg>
        </button>
      </div>
      <div class="mic-label" id="micLabel">दबाकर बोलें &nbsp;·&nbsp; Press to speak</div>
    </div>

    <!-- OFFLINE QUEUE -->
    <div class="queue-card" id="queueCard">
      <h3>📦 Offline Queue — will sync when connected</h3>
      <div id="queueList"></div>
    </div>

    <!-- RESULT -->
    <div class="result-card" id="resultCard">
      <div class="result-section">
        <label>You asked</label>
        <div class="transcript-text" id="transcriptText"></div>
      </div>
      <div class="divider"></div>
      <div class="result-section">
        <label>Answer</label>
        <div class="answer-text" id="answerText"></div>
      </div>
      <button class="play-btn" id="playBtn" onclick="playAnswer()">
        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        Play answer
      </button>
    </div>

    <!-- SUGGESTIONS -->
    <div class="suggestions">
      <h3>Try asking</h3>
      <div class="pills" id="pillsContainer">
        <button class="pill" onclick="askText('PM KISAN ke liye kaise apply karein?')">PM-KISAN के लिए कैसे आवेदन करें?</button>
        <button class="pill" onclick="askText('Ayushman Bharat ka labh kaise milega?')">Ayushman Bharat का लाभ कैसे मिलेगा?</button>
        <button class="pill" onclick="askText('Pradhan Mantri Awas Yojana ke documents kya chahiye?')">PMAY के लिए कौन से documents चाहिए?</button>
        <button class="pill" onclick="askText('PM KISAN helpline number kya hai?')">PM-KISAN helpline number?</button>
      </div>
    </div>

  </main>
  <footer>VisionaryMinds · Foundathon 2025 · GramVoice MVP</footer>
</div>

<script>
const API = "http://localhost:8000";

let mediaRecorder = null;
let audioChunks   = [];
let isRecording   = false;
let selectedLang  = "hi-IN";
let offlineQueue  = JSON.parse(localStorage.getItem("gramvoice_queue") || "[]");
let lastAudioBlob = null;
let lastAudioURL  = null;

// ── Lang selection ─────────────────────────────────────────────────────────
document.querySelectorAll(".lang-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".lang-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    selectedLang = btn.dataset.lang;
  });
});

// ── Connectivity ───────────────────────────────────────────────────────────
function updateStatus() {
  const bar  = document.getElementById("statusBar");
  const text = document.getElementById("statusText");
  if (navigator.onLine) {
    bar.className  = "status-bar online";
    text.textContent = "Connected";
    processQueue();
  } else {
    bar.className  = "status-bar offline";
    text.textContent = `Offline — ${offlineQueue.length} query queued`;
  }
}
window.addEventListener("online",  updateStatus);
window.addEventListener("offline", updateStatus);
updateStatus();

// ── Record toggle ─────────────────────────────────────────────────────────
async function toggleRecord() {
  if (isRecording) {
    stopRecording();
  } else {
    await startRecording();
  }
}

async function startRecording() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    mediaRecorder = new MediaRecorder(stream, { mimeType: "audio/webm;codecs=opus" });
    audioChunks = [];
    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
    mediaRecorder.onstop = handleRecordingStop;
    mediaRecorder.start();
    isRecording = true;
    setUIRecording(true);
  } catch(e) {
    setLabel("Microphone access denied ❌");
  }
}

function stopRecording() {
  if (mediaRecorder) mediaRecorder.stop();
  isRecording = false;
  setUIRecording(false);
}

function setUIRecording(on) {
  const btn = document.getElementById("micBtn");
  const icon = document.getElementById("micIcon");
  btn.classList.toggle("recording", on);
  setLabel(on ? "Recording… tap to stop · रिकॉर्ड हो रहा है" : "Processing…");
  icon.innerHTML = on
    ? '<rect x="9" y="9" width="6" height="6"/>'   // stop square
    : '<path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.91-3c-.49 0-.9.36-.98.85C16.52 14.2 14.47 16 12 16s-4.52-1.8-4.93-4.15c-.08-.49-.49-.85-.98-.85-.61 0-1.09.54-1 1.14.49 3 2.89 5.35 5.91 5.78V20c0 .55.45 1 1 1s1-.45 1-1v-2.08c3.02-.43 5.42-2.78 5.91-5.78.1-.6-.39-1.14-1-1.14z"/>';
}

async function handleRecordingStop() {
  const blob = new Blob(audioChunks, { type: "audio/webm" });
  setUILoading(true);
  if (navigator.onLine) {
    await sendAudio(blob);
  } else {
    queueAudio(blob);
  }
  setUILoading(false);
}

// ── Send audio ─────────────────────────────────────────────────────────────
async function sendAudio(blob) {
  const form = new FormData();
  form.append("audio", blob, "query.webm");
  form.append("lang",  selectedLang);
  try {
    const res = await fetch(`${API}/query/voice?lang=${selectedLang}`, {
      method: "POST", body: form
    });
    if (!res.ok) throw new Error(await res.text());

    const transcript = res.headers.get("X-Transcript") || "";
    const answer     = res.headers.get("X-Answer")     || "";
    lastAudioBlob    = await res.blob();
    lastAudioURL     = URL.createObjectURL(lastAudioBlob);

    showResult(transcript, answer);
    setLabel("दबाकर बोलें &nbsp;·&nbsp; Press to speak");
  } catch(e) {
    setLabel("Error: " + e.message);
  }
}

// ── Text query (pills) ────────────────────────────────────────────────────
async function askText(q) {
  showResult(q, "…");
  setLabel("Processing…");
  try {
    const res = await fetch(`${API}/query/text`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question: q, lang: selectedLang })
    });
    const data = await res.json();
    showResult(data.question, data.answer);
  } catch(e) {
    showResult(q, "Server not reachable. Start the backend first.");
  }
  setLabel("दबाकर बोलें &nbsp;·&nbsp; Press to speak");
}

// ── Offline queue ─────────────────────────────────────────────────────────
function queueAudio(blob) {
  const reader = new FileReader();
  reader.onload = () => {
    offlineQueue.push({ data: reader.result, lang: selectedLang, ts: Date.now() });
    localStorage.setItem("gramvoice_queue", JSON.stringify(offlineQueue));
    renderQueue();
    updateStatus();
  };
  reader.readAsDataURL(blob);
}

async function processQueue() {
  if (!offlineQueue.length) return;
  const item = offlineQueue.shift();
  localStorage.setItem("gramvoice_queue", JSON.stringify(offlineQueue));
  renderQueue();
  const res  = await fetch(item.data);
  const blob = await res.blob();
  await sendAudio(blob);
}

function renderQueue() {
  const card = document.getElementById("queueCard");
  const list = document.getElementById("queueList");
  if (!offlineQueue.length) { card.classList.remove("visible"); return; }
  card.classList.add("visible");
  list.innerHTML = offlineQueue.map((q, i) =>
    `<div class="queue-item"><div class="queue-dot"></div>Query #${i+1} — ${new Date(q.ts).toLocaleTimeString()}</div>`
  ).join("");
}

// ── Play TTS ──────────────────────────────────────────────────────────────
function playAnswer() {
  if (!lastAudioURL) return;
  new Audio(lastAudioURL).play();
}

// ── UI helpers ────────────────────────────────────────────────────────────
function showResult(transcript, answer) {
  document.getElementById("transcriptText").textContent = transcript;
  document.getElementById("answerText").textContent     = answer;
  document.getElementById("resultCard").classList.add("visible");
  document.getElementById("playBtn").style.display = lastAudioURL ? "flex" : "none";
}

function setLabel(html) {
  document.getElementById("micLabel").innerHTML = html;
}

function setUILoading(on) {
  const btn  = document.getElementById("micBtn");
  const icon = document.getElementById("micIcon");
  btn.classList.toggle("loading", on);
  icon.innerHTML = on
    ? '<circle cx="12" cy="12" r="4" opacity="0.5"/>'
    : '<path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.91-3c-.49 0-.9.36-.98.85C16.52 14.2 14.47 16 12 16s-4.52-1.8-4.93-4.15c-.08-.49-.49-.85-.98-.85-.61 0-1.09.54-1 1.14.49 3 2.89 5.35 5.91 5.78V20c0 .55.45 1 1 1s1-.45 1-1v-2.08c3.02-.43 5.42-2.78 5.91-5.78.1-.6-.39-1.14-1-1.14z"/>';
}

renderQueue();
</script>
</body>
</html>
